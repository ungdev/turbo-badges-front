name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  deploy-dev:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install docker
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_DEV }}
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL_DEV }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT_DEV }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/turbobadges/front:dev

  deploy-prod:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install docker
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/turbobadges/front:prod